name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS matters most: its /bin/bash is 3.2, and every bug this repo has
        # shipped in the shell config so far was visible only there.
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Install zsh (Linux runners have no zsh)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsh

      - name: Shells under test
        run: |
          printf 'system bash: '; /bin/bash --version | head -1
          command -v /opt/homebrew/bin/bash >/dev/null && { printf 'brew bash:   '; /opt/homebrew/bin/bash --version | head -1; } || true
          command -v /usr/local/bin/bash   >/dev/null && { printf 'brew bash:   '; /usr/local/bin/bash --version   | head -1; } || true
          printf 'zsh:         '; zsh --version

      # Deliberately no starship/fzf/zoxide/uv installed: the configs are all
      # guarded, and a bare runner is the cheapest way to keep proving it.
      - name: Self-test
        run: ./install/selftest.sh
